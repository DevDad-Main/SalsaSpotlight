<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <div id="app">
      <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="bar">
        <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="text" placeholder="Spotlight Search" spellcheck="false" autocomplete="off" autofocus>
        <div class="quick-chips">
          <button class="chip-btn" id="chip-apps" title="Search Applications (type:app)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></button>
          <button class="chip-btn" id="chip-folders" title="Search Folders (type:folder)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
          <button class="chip-btn" id="chip-files" title="Search Files (type:file)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg></button>
          <button class="chip-btn" id="chip-calc" title="Calculator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"/></svg></button>
        </div>
      </div>
      <ul id="list"></ul>
      <div id="foot" hidden><span><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>Tab</kbd> Navigate</span><span><kbd>Enter</kbd> Open</span><span><kbd>Ctrl</kbd><kbd>Enter</kbd> Folder</span><span><kbd>Ctrl</kbd><kbd>I</kbd> Details</span><span><kbd>Esc</kbd> Close</span></div>
      <aside id="details"></aside>
      <div id="toast"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
